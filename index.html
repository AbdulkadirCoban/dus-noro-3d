<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DUS Nöro 3D</title>
    <meta name="description" content="DUS için 3B nörovasküler ve kafa tabanı anatomi atlası" />
    <meta name="theme-color" content="#10151c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DUS Nöro 3D" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="btn-list" class="icon-btn" aria-label="Yapı listesini aç veya kapat">☰</button>
        <h1>DUS Nöro 3D</h1>
        <nav id="tabs" role="tablist">
          <button role="tab" data-view="atlas" class="on">Atlas</button>
          <button role="tab" data-view="quiz">Quiz</button>
          <button role="tab" data-view="sources">Kaynaklar</button>
        </nav>
      </header>

      <main id="main" data-view="atlas">
        <aside id="list-panel" aria-label="Yapı listesi">
          <div class="search">
            <input id="search" type="search" placeholder="Yapı ara (ör. ovale, V3, meningea)" autocomplete="off" autocorrect="off" spellcheck="false" />
          </div>
          <div id="list"></div>
        </aside>

        <section id="stage" aria-label="3B sahne">
          <canvas id="canvas"></canvas>
          <div id="labels"></div>
          <div id="pins"></div>
          <div id="chips" role="group" aria-label="Katman filtreleri"></div>
          <label id="bone-op"><span>Kemik saydamlığı</span><input type="range" id="bone-range" min="0" max="92" step="1" value="0" /></label>

          <div id="stage-tools">
            <button class="tool" data-view-preset="front">Ön</button>
            <button class="tool" data-view-preset="right">Sağ</button>
            <button class="tool" data-view-preset="left">Sol</button>
            <button class="tool" data-view-preset="top">Üst</button>
            <button class="tool" data-view-preset="bottom">Alt</button>
            <button class="tool" id="btn-home">Genel</button>
            <button class="tool" id="btn-clip" aria-expanded="false">Kesit</button>
            <button class="tool" id="btn-motion" aria-expanded="false" hidden>Çene hareketi</button>
          </div>

          <div id="clip-panel" hidden>
            <div class="clip-row">
              <button class="axis-btn" data-axis="y" aria-pressed="false" aria-label="Aksiyel kesiti aç veya kapat">
                <svg viewBox="0 0 28 28" aria-hidden="true"><path class="cut" d="M14 3 25 9 14 15 3 9Z" /><path d="M3 9 14 15V26L3 20Z" /><path d="M25 9 14 15V26L25 20Z" /></svg>
              </button>
              <label><span>Aksiyel</span><input type="range" id="clip-y" /></label>
            </div>
            <div class="clip-row">
              <button class="axis-btn" data-axis="x" aria-pressed="false" aria-label="Sagittal kesiti aç veya kapat">
                <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 25 9 14 15 3 9Z" /><path d="M3 9 14 15V26L3 20Z" /><path class="cut" d="M25 9 14 15V26L25 20Z" /></svg>
              </button>
              <label><span>Sagittal</span><input type="range" id="clip-x" /></label>
            </div>
            <div class="clip-row">
              <button class="axis-btn" data-axis="z" aria-pressed="false" aria-label="Koronal kesiti aç veya kapat">
                <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 25 9 14 15 3 9Z" /><path class="cut" d="M3 9 14 15V26L3 20Z" /><path d="M25 9 14 15V26L25 20Z" /></svg>
              </button>
              <label><span>Koronal</span><input type="range" id="clip-z" /></label>
            </div>
            <div id="clip-presets" role="group" aria-label="Hazır kesitler"></div>
            <p id="clip-hint" hidden></p>
            <div class="clip-actions">
              <button class="tool" id="btn-section" aria-expanded="false">Kesit görüntüsü</button>
              <button class="tool" id="clip-reset">Kesiti kaldır</button>
            </div>
          </div>

          <div id="motion-panel" hidden role="group" aria-label="Çene hareketi"></div>

          <div id="section-panel" hidden role="group" aria-label="Kesit görüntüsü">
            <div class="section-head">
              <b id="section-title">Kesit görüntüsü</b>
              <button class="tool" id="section-zoom" aria-pressed="false" hidden>Yakın</button>
              <button class="tool" id="section-close" aria-label="Kesit görüntüsünü kapat">✕</button>
            </div>
            <p id="section-note">3B modelden üretilmiş şematik kesit, gerçek BT değildir</p>
            <canvas id="section-canvas"></canvas>
            <div class="section-key"><i style="--c: var(--nerve)"></i>Sinir<i style="--c: var(--artery)"></i>Arter<i style="--c: var(--vein)"></i>Ven</div>
          </div>

          <div id="loader" role="status">
            <div class="bar"><i id="loader-bar"></i></div>
            <span id="loader-text">Kemik katmanı yükleniyor…</span>
          </div>
        </section>

        <aside id="detail-panel" aria-label="Yapı ayrıntıları">
          <button id="btn-sheet" class="sheet-handle" aria-label="Paneli aç veya kapat" aria-expanded="true"><i></i></button>
          <div id="detail"></div>
        </aside>

        <aside id="quiz-panel" aria-label="Quiz" hidden></aside>
      </main>

      <section id="sources" hidden></section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
